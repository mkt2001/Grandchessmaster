name: Build APK and Publish GitHub Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses || true

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="3D-GRANDMASTER-CHESS-PROFESSIONAL-OFFLINE.zip"

          test -f "$ZIP_FILE"

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Godot project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android Export Preset
        shell: bash
        run: |
          set -euo pipefail

          PRESET="$PROJECT_DIR/export_presets.cfg"

          if [ ! -f "$PRESET" ]; then
            echo "export_presets.cfg not found!"
            exit 1
          fi

          python3 - "$PRESET" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          data = re.sub(
              r'(?m)^gradle_build/min_sdk=.*\n?',
              '',
              data
          )

          data = re.sub(
              r'(?m)^gradle_build/target_sdk=.*\n?',
              '',
              data
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          print("Android SDK preset configuration fixed.")
          PY

      - name: Configure Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot Project
        run: |
          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/release-files/3D-Grandmaster-Chess.apk"

          if [ ! -s release-files/3D-Grandmaster-Chess.apk ]; then
            echo "APK export failed!"
            exit 1
          fi

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-build-${{ github.run_number }}"
          name: "3D Grandmaster Chess Build ${{ github.run_number }}"
          body: "Automated Android APK build."
          files: release-files/3D-Grandmaster-Chess.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
