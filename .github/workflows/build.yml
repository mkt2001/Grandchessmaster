name: Build APK and Publish GitHub Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          yes | sdkmanager --licenses || true

      - name: Install Official Godot Android Templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"

          TEMP_DIR=$(mktemp -d)

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"

          echo "Downloading official Godot templates..."

          curl -fL "$TEMPLATE_URL" \
            -o "$TEMP_DIR/templates.tpz"

          mkdir -p "$TEMP_DIR/unpacked"

          unzip -q "$TEMP_DIR/templates.tpz" \
            -d "$TEMP_DIR/unpacked"

          DEBUG_TEMPLATE=$(find "$TEMP_DIR/unpacked" \
            -type f -name android_debug.apk -print -quit)

          if [ -z "$DEBUG_TEMPLATE" ]; then
            echo "::error::Android debug template not found in archive"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$DEBUG_TEMPLATE")

          cp -a "$SOURCE_DIR/." "$TEMPLATE_DIR/"

          echo "Installed templates:"
          ls -lh "$TEMPLATE_DIR"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

          echo "Both Android templates verified."

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="3D-GRANDMASTER-CHESS-PROFESSIONAL-OFFLINE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found"
            exit 1
          fi

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted \
            -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Godot project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Create Android Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Android Export Preset
        shell: bash
        run: |
          set -euo pipefail

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.grandmaster.chess3d"
          package/name="3D Grandmaster Chess"
          package/signed=true
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          EOF

          echo "Android preset created."

      - name: Configure Godot Android Paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot Project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Verify Complete Build Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Godot version:"
          godot --headless --version

          echo "Java:"
          java -version

          echo "Android SDK:"
          test -d "$ANDROID_HOME/platforms/android-34"

          echo "Android NDK:"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

          echo "Godot Android templates:"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

          echo "Debug keystore:"
          test -s "$HOME/.android/debug.keystore"

          echo "All required files verified."

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release-files"

          godot --headless \
            --verbose \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/release-files/3D-Grandmaster-Chess.apk"

          if [ ! -s "$GITHUB_WORKSPACE/release-files/3D-Grandmaster-Chess.apk" ]; then
            echo "::error::APK generation failed"
            exit 1
          fi

          echo "APK generated successfully."

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-build-${{ github.run_number }}"
          name: "3D Grandmaster Chess Build ${{ github.run_number }}"
          body: |
            3D Grandmaster Chess
            Offline Android APK.
          files: release-files/3D-Grandmaster-Chess.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
