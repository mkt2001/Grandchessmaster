name: Build APK and Publish GitHub Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses || true

      - name: Extract uploaded ZIP
        run: |
          set -e

          ZIP_FILE="3D-GRANDMASTER-CHESS-PROFESSIONAL-OFFLINE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.t
