name: Build APK and Publish GitHub Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Godot
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses || true

      # 5. Extract ZIP
      - name: Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="3D-GRANDMASTER-CHESS-PROFESSIONAL-OFFLINE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found!"
            exit 1
          fi

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted \
            -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Godot project not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 6. Completely recreate Android Export Preset
      - name: Create Clean Android Export Preset
        shell: bash
        run: |
          set -euo pipefail

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0.0"

          package/unique_name="com.grandmaster.chess3d"
          package/name="3D Grandmaster Chess"
          package/signed=true

          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          EOF

          echo "Fresh Android export preset created."

      # 7. Configure SDK
      - name: Configure Android Paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      # 8. Import project
      - name: Import Godot Project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      # 9. Check Android templates
      - name: Check Export Templates
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --version

          echo "Checking Android SDK:"
          test -d "$ANDROID_HOME/platforms/android-34"

          echo "Checking Java:"
          java -version

          echo "Android export environment ready."

      # 10. Export APK
      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release-files"

          godot --headless \
            --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/release-files/3D-Grandmaster-Chess.apk"

          if [ ! -s "$GITHUB_WORKSPACE/release-files/3D-Grandmaster-Chess.apk" ]; then
            echo "::error::APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated."

      # 11. Publish Release
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-build-${{ github.run_number }}"
          name: "3D Grandmaster Chess Build ${{ github.run_number }}"
          body: |
            3D Grandmaster Chess
            Automated Android Debug APK.
          files: release-files/3D-Grandmaster-Chess.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
